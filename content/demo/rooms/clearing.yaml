id: clearing
title: A forest clearing
description: >-
  Beyond the castle wall, a path leads to a clearing with a crackling
  campfire, where runaways rest. By the fire lie a guard's purse, a basket
  of apples, an old hunting horn, a bundle of torches and a pair of dice.
  A little stone shrine stands under an oak. The path goes on, towards
  home.
