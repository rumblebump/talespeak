# Every server uses this same file; only .env differs. CI deploys copy it to
# ~/talespeak on the server on every deploy (see scripts/deploy.sh).
#   docker compose up -d                      # engine + Caddy
#   docker compose --profile ai up -d         # also start the optional LLM sidecar
#                                             # (or COMPOSE_PROFILES=ai in .env)

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      TALESPEAK_DOMAIN: ${TALESPEAK_DOMAIN:?set TALESPEAK_DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates live here; keep this volume
      - caddy_config:/config
    depends_on:
      talespeak:
        condition: service_healthy

  talespeak:
    image: ghcr.io/${GH_OWNER:?set GH_OWNER in .env}/talespeak:${TALESPEAK_VERSION:-latest}
    restart: unless-stopped
    environment:
      TALESPEAK_DATA: /data
      TALESPEAK_LISTEN: ":8080"
      TALESPEAK_KIDS_MODE: ${TALESPEAK_KIDS_MODE:-false}
      # CIDR list whose X-Forwarded-For is believed; empty in .env keeps the engine default (loopback + private ranges, which include Caddy)
      TALESPEAK_TRUSTED_PROXIES: ${TALESPEAK_TRUSTED_PROXIES:-}
      # Host names the engine answers, comma-separated; others get 421 (docs/admin-limits.md)
      TALESPEAK_HOSTS: ${TALESPEAK_HOSTS:-${TALESPEAK_DOMAIN}}
      TALESPEAK_LLM_URL: ${TALESPEAK_LLM_URL:-} # empty = AI features off
      # Who may register and play (docs/accounts.md); empty keeps the engine default.
      TALESPEAK_MODE: ${TALESPEAK_MODE:-}
      TALESPEAK_REGISTRATION: ${TALESPEAK_REGISTRATION:-}
      TALESPEAK_WORLD_ACCESS: ${TALESPEAK_WORLD_ACCESS:-}
      # Resource limits (docs/admin-limits.md); empty keeps the engine default.
      TALESPEAK_LUA_TIME: ${TALESPEAK_LUA_TIME:-}
      TALESPEAK_LUA_CLIENT_RATE: ${TALESPEAK_LUA_CLIENT_RATE:-}
      TALESPEAK_LUA_CLIENT_BURST: ${TALESPEAK_LUA_CLIENT_BURST:-}
      TALESPEAK_LUA_CALL_MEMORY: ${TALESPEAK_LUA_CALL_MEMORY:-}
      TALESPEAK_LUA_PLAYER_MEMORY: ${TALESPEAK_LUA_PLAYER_MEMORY:-}
      TALESPEAK_LUA_CLIENT_MEMORY: ${TALESPEAK_LUA_CLIENT_MEMORY:-}
      TALESPEAK_LUA_STATE_MEMORY: ${TALESPEAK_LUA_STATE_MEMORY:-}
      TALESPEAK_PACK_IMAGE_MAX: ${TALESPEAK_PACK_IMAGE_MAX:-}
      TALESPEAK_PACK_IMAGES_TOTAL: ${TALESPEAK_PACK_IMAGES_TOTAL:-}
      TALESPEAK_MAX_CONNS: ${TALESPEAK_MAX_CONNS:-}
      TALESPEAK_MAX_CONNS_PER_CLIENT: ${TALESPEAK_MAX_CONNS_PER_CLIENT:-}
      TALESPEAK_CONNECT_RATE: ${TALESPEAK_CONNECT_RATE:-}
      TALESPEAK_CONNECT_BURST: ${TALESPEAK_CONNECT_BURST:-}
      TALESPEAK_MESSAGE_RATE: ${TALESPEAK_MESSAGE_RATE:-}
      TALESPEAK_MESSAGE_BURST: ${TALESPEAK_MESSAGE_BURST:-}
      TALESPEAK_IDLE_TIMEOUT: ${TALESPEAK_IDLE_TIMEOUT:-}
      TALESPEAK_SIGNIN_BURST: ${TALESPEAK_SIGNIN_BURST:-}
    volumes:
      - talespeak_data:/data # SQLite database, uploads, backups
    expose:
      - "8080"

  llm:
    profiles: ["ai"]
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    command: >
      -m /models/${LLM_MODEL_FILE:-model.gguf}
      --host 0.0.0.0 --port 8081
      --ctx-size 2048 --threads ${LLM_THREADS:-2}
    volumes:
      - ./models:/models:ro
    expose:
      - "8081"

volumes:
  caddy_data:
  caddy_config:
  talespeak_data:
