# One workflow for pushes and pull requests. A cheap "changes" job decides
# which expensive jobs run, and "ci-ok" always reports so it can be the only
# required status check in branch protection (path filters at the trigger
# level would leave required checks pending forever on docs-only changes).

name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.filter.outputs.go }}
      web: ${{ steps.filter.outputs.web }}
      image: ${{ steps.filter.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            go:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'content/**'   # YAML stories, Lua rule packs, glossaries
            web:
              - 'web/**'
            image:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - 'web/**'
              - 'content/**'
              - 'Dockerfile'

  # Always runs: cheap, and protocol files are the most likely place for a leak.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            git /repo --redact --no-banner \
            --log-opts="${{ github.event.before && github.event.before != '0000000000000000000000000000000000000000' && format('{0}..{1}', github.event.before, github.sha) || '-1' }}"

  go:
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod # module and build cache are on by default
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/talespeak

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Filled in once the client has a build step (T-0004).
      - run: echo "web checks go here"

  # Builds the image on pull requests to catch Dockerfile breakage, without pushing.
  # On main it builds amd64 + arm64 and pushes the "edge" tag for the dev server.
  image:
    needs: [changes, go, web]
    if: >
      always() && needs.changes.outputs.image == 'true' &&
      !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ github.ref == 'refs/heads/main' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/talespeak:edge
            ghcr.io/${{ github.repository_owner }}/talespeak:sha-${{ github.sha }}
          build-args: VERSION=edge-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-dev:
    needs: image
    if: github.ref == 'refs/heads/main' && needs.image.result == 'success'
    runs-on: ubuntu-latest
    environment: dev
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    steps:
      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DEV_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEV_SSH_KNOWN_HOSTS }}
          SSH_TARGET: ${{ secrets.DEV_SSH_USER }}@${{ secrets.DEV_SSH_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "$SSH_TARGET" 'cd ~/talespeak && docker compose pull talespeak && docker compose up -d && docker image prune -f'

  ci-ok:
    needs: [changes, secrets, go, web, image, deploy-dev]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any needed job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
      - run: echo "all needed jobs passed or were skipped"
